name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # aieos-governance-foundation — kit-manifest.yml + the convention
      # conformance fixture the FR-023 deriveFlow tests assert against
      # (they skip when this checkout is absent)
      - uses: actions/checkout@v4
        with:
          repository: wtlinnertz/aieos-governance-foundation
          ref: main
          path: aieos-governance-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run type-check
      - name: Unit tests (vitest)
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E (Playwright; app auto-started with mock provider)
        run: npm run test:e2e
